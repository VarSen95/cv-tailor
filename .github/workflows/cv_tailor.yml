name: Daily CV Tailor

on:
  schedule:
    # Runs every day at 22:00 UTC (11pm Dublin/London, midnight Amsterdam)
    - cron: '0 22 * * *'

  # Trigger manually from the Actions tab any time
  workflow_dispatch:

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google credentials
        run: echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json

      - name: Write Google token
        run: echo '${{ secrets.GOOGLE_TOKEN_JSON }}' > token.json

      - name: Run CV tailor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python cv_tailor_daily.py
